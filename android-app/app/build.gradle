plugins {
    id "com.android.application"
}

def appBuildTime = new Date().format("yyyy-MM-dd HH:mm", TimeZone.getTimeZone("Asia/Shanghai"))

android {
    namespace "com.epochhit.smartcar"
    compileSdk 35

    defaultConfig {
        applicationId "com.epochhit.smartcar"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.2.0"
        buildConfigField "String", "BUILD_TIME", "\"${appBuildTime}\""
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias "smartcar"
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    buildFeatures {
        buildConfig true
    }
}

def webRoot = rootProject.projectDir.parentFile

tasks.register("syncWebAssets", Sync) {
    from(webRoot) {
        include "index.html", "app.js", "styles.css"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
