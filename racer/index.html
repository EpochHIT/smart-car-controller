<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电机最高速度测试</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #0b1117; color: #f3f7fb; }
    * { box-sizing: border-box; }
    body { max-width: 900px; margin: 0 auto; padding: 22px; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 38px); }
    .subtitle { margin: 7px 0 20px; color: #91a2b4; }
    .card { margin-bottom: 14px; padding: 18px; border: 1px solid #263546; border-radius: 16px; background: #131d27; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    button, input { font: inherit; }
    button { min-height: 46px; padding: 10px 17px; border: 0; border-radius: 10px; color: white; background: #2878d0; cursor: pointer; font-weight: 700; }
    button:hover { filter: brightness(1.12); }
    button:disabled { cursor: default; opacity: .42; }
    .secondary { background: #344455; }
    .full { background: #e58a16; }
    .stop { flex: 1; min-width: 180px; background: #d13e3e; font-size: 19px; }
    .status { padding: 8px 12px; border-radius: 999px; color: #ffbdc2; background: #42262b; }
    .status.online { color: #83e7ae; background: #183d2b; }
    .hint { color: #91a2b4; font-size: 13px; line-height: 1.6; }
    .warning { color: #ffd27b; }
    .speed-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .speed-card { padding: 18px; text-align: center; border-radius: 14px; background: #0d151d; }
    .side { color: #9db0c2; font-size: 16px; }
    .rpm { display: block; margin: 3px 0; color: #66d6ff; font-size: clamp(42px, 10vw, 72px); line-height: 1; }
    .unit { color: #7f91a3; }
    .peak { margin-top: 12px; color: #ffc466; font-size: 17px; }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 14px; }
    .metric { padding: 11px; border-radius: 10px; background: #0d151d; }
    .metric small { display: block; color: #7f91a3; }
    .metric strong { display: block; margin-top: 3px; font-size: 20px; }
    .control-label { display: flex; justify-content: space-between; gap: 12px; }
    input[type="range"] { width: 100%; margin: 14px 0; accent-color: #31a9f4; }
    input[type="number"] { width: 100px; padding: 8px; border: 1px solid #40536a; border-radius: 8px; background: #0c141c; color: white; }
    details { color: #aebdca; }
    summary { cursor: pointer; }
    pre { max-height: 160px; overflow: auto; padding: 10px; border-radius: 8px; background: #080c11; color: #9db0c2; white-space: pre-wrap; font-size: 12px; }
    @media (max-width: 650px) {
      body { padding: 14px; }
      .speed-grid { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      button { flex: 1; }
    }
  </style>
</head>
<body>
  <h1>电机最高速度测试</h1>
  <p class="subtitle">JDY-31 SPP · 57600 8N1 · 左右编码器实时反馈</p>

  <section class="card">
    <div class="row">
      <button id="connect">连接 JDY-31</button>
      <button id="disconnect" class="secondary" disabled>断开</button>
      <span id="connection" class="status">未连接</span>
    </div>
    <p class="hint">选择 Windows 中 JDY-31 配对后生成的“传出”COM 口。</p>
  </section>

  <section class="card">
    <div class="speed-grid">
      <div class="speed-card">
        <div class="side">左轮转速</div>
        <strong id="rpmL" class="rpm">—</strong>
        <span class="unit">RPM</span>
        <div class="peak">最高：<b id="maxRpmL">0</b> RPM</div>
      </div>
      <div class="speed-card">
        <div class="side">右轮转速</div>
        <strong id="rpmR" class="rpm">—</strong>
        <span class="unit">RPM</span>
        <div class="peak">最高：<b id="maxRpmR">0</b> RPM</div>
      </div>
    </div>
    <div class="metrics">
      <div class="metric"><small>左编码器/20 ms</small><strong id="encL">—</strong></div>
      <div class="metric"><small>右编码器/20 ms</small><strong id="encR">—</strong></div>
      <div class="metric"><small>左累计边沿</small><strong id="totalL">—</strong></div>
      <div class="metric"><small>右累计边沿</small><strong id="totalR">—</strong></div>
      <div class="metric"><small>左 PWM</small><strong id="outL">—</strong></div>
      <div class="metric"><small>右 PWM</small><strong id="outR">—</strong></div>
      <div class="metric"><small>运行状态</small><strong id="runState">停止</strong></div>
      <div class="metric"><small>编码器故障</small><strong id="fault">—</strong></div>
    </div>
  </section>

  <section class="card">
    <div class="control-label">
      <label for="power">测试功率</label>
      <strong><span id="powerValue">30</span>%</strong>
    </div>
    <input id="power" type="range" min="0" max="100" value="30" step="1">
    <div class="row">
      <button id="start">▶ 开始测试</button>
      <button id="full" class="full">⚡ 100% 全速</button>
      <button id="stop" class="stop">■ 立即停车</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="reset" class="secondary">清零并重新测</button>
    </div>
    <p class="hint warning">第一次测试必须架空车轮，并保证可以立即断开电机电源。</p>
  </section>

  <section class="card">
    <details>
      <summary>转速校准（RPM 不对时再改）</summary>
      <div class="row" style="margin-top:12px">
        <label for="edgesPerRev">车轮每转一圈的 A 相双边沿数</label>
        <input id="edgesPerRev" type="number" min="1" step="1" value="40">
      </div>
      <p class="hint">默认 40 = 20 槽编码盘 × 上下沿。转动车轮一整圈，查看累计边沿增量，就能填入准确值。</p>
    </details>
  </section>

  <section class="card">
    <details>
      <summary>诊断信息</summary>
      <pre id="log"></pre>
    </details>
  </section>

  <script>
    const BAUD_RATE = 57600;
    const CONTROL_PERIOD_MS = 20;
    const PWM_MAX = 900;
    const SMOOTH_SAMPLES = 5;
    let port, reader;
    let keepReading = false;
    let writeChain = Promise.resolve();
    let activeCommand = "";
    let lineBuffer = "";
    let maxRpmL = 0;
    let maxRpmR = 0;
    const leftHistory = [];
    const rightHistory = [];
    const el = id => document.getElementById(id);

    function log(text) {
      const lines = (el("log").textContent + new Date().toLocaleTimeString() + " " + text + "\n").split("\n");
      el("log").textContent = lines.slice(-31).join("\n");
      el("log").scrollTop = el("log").scrollHeight;
    }

    function setConnected(connected) {
      el("connect").disabled = connected;
      el("disconnect").disabled = !connected;
      el("start").disabled = !connected;
      el("full").disabled = !connected;
      el("reset").disabled = !connected;
      el("connection").textContent = connected ? "已连接" : "未连接";
      el("connection").classList.toggle("online", connected);
    }

    async function send(command, show = true) {
      if (!port?.writable) {
        if (show) log("未发送（未连接）：" + command);
        return;
      }
      writeChain = writeChain.then(async () => {
        const writer = port.writable.getWriter();
        try {
          await writer.write(new TextEncoder().encode(command + "\r\n"));
        } finally {
          writer.releaseLock();
        }
      }).catch(error => log("发送失败：" + error.message));
      if (show) log("> " + command);
      return writeChain;
    }

    function powerToPwm() {
      return Math.round(Number(el("power").value) * PWM_MAX / 100);
    }

    function startTest() {
      const pwm = powerToPwm();
      if (pwm <= 0) return stopTest();
      activeCommand = "PWM " + pwm + " " + pwm;
      el("runState").textContent = "运行";
      send(activeCommand);
    }

    function stopTest() {
      activeCommand = "";
      el("runState").textContent = "停止";
      send("STOP");
    }

    function resetMeasurement() {
      activeCommand = "";
      maxRpmL = 0;
      maxRpmR = 0;
      leftHistory.length = 0;
      rightHistory.length = 0;
      el("maxRpmL").textContent = "0";
      el("maxRpmR").textContent = "0";
      el("runState").textContent = "停止";
      send("CLEAR");
    }

    function movingAverage(history, value) {
      history.push(value);
      if (history.length > SMOOTH_SAMPLES) history.shift();
      return history.reduce((sum, item) => sum + item, 0) / history.length;
    }

    function parseTelemetry(line) {
      if (!(line.startsWith("T ") || line.startsWith("STATUS "))) return;
      const values = {};
      for (const item of line.split(/\s+/).slice(1)) {
        const split = item.indexOf("=");
        if (split > 0) values[item.slice(0, split)] = item.slice(split + 1);
      }
      const edgesL = Number(values.encL || 0);
      const edgesR = Number(values.encR || 0);
      const edgesPerRev = Math.max(1, Number(el("edgesPerRev").value) || 1);
      const rpmFactor = 60000 / CONTROL_PERIOD_MS / edgesPerRev;
      const rpmL = movingAverage(leftHistory, edgesL) * rpmFactor;
      const rpmR = movingAverage(rightHistory, edgesR) * rpmFactor;
      maxRpmL = Math.max(maxRpmL, rpmL);
      maxRpmR = Math.max(maxRpmR, rpmR);
      el("rpmL").textContent = Math.round(rpmL);
      el("rpmR").textContent = Math.round(rpmR);
      el("maxRpmL").textContent = Math.round(maxRpmL);
      el("maxRpmR").textContent = Math.round(maxRpmR);
      el("encL").textContent = edgesL;
      el("encR").textContent = edgesR;
      el("totalL").textContent = values.totalL ?? "—";
      el("totalR").textContent = values.totalR ?? "—";
      el("outL").textContent = values.pwmL ?? "—";
      el("outR").textContent = values.pwmR ?? "—";
      el("fault").textContent = values.fault === "1" ? "有" : "无";
      if (values.mode === "STOP") el("runState").textContent = "停止";
    }

    function handleLine(line) {
      if (!line) return;
      log("< " + line);
      parseTelemetry(line);
      if (line.includes("encoder_fault") || line.includes("watchdog")) {
        activeCommand = "";
        el("runState").textContent = "已停车";
      }
    }

    async function readLoop() {
      const decoder = new TextDecoder();
      keepReading = true;
      while (port?.readable && keepReading) {
        reader = port.readable.getReader();
        try {
          while (keepReading) {
            const result = await reader.read();
            if (result.done) break;
            lineBuffer += decoder.decode(result.value, { stream: true });
            const lines = lineBuffer.split(/\r?\n/);
            lineBuffer = lines.pop();
            lines.forEach(handleLine);
          }
        } catch (error) {
          if (keepReading) log("读取失败：" + error.message);
        } finally {
          reader.releaseLock();
          reader = undefined;
        }
      }
    }

    async function disconnect() {
      activeCommand = "";
      if (!port) return;
      try { await send("STOP", false); } catch (_) {}
      keepReading = false;
      if (reader) await reader.cancel().catch(() => {});
      await writeChain;
      await port.close().catch(() => {});
      port = undefined;
      el("runState").textContent = "停止";
      setConnected(false);
      log("串口已断开");
    }

    el("connect").addEventListener("click", async () => {
      if (!("serial" in navigator)) {
        log("请使用桌面版 Chrome/Edge，并通过 localhost 打开本页面。");
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: BAUD_RATE, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
        setConnected(true);
        log("串口已连接：57600 8N1");
        readLoop();
        await send("TELEM 100");
        await send("PING");
      } catch (error) {
        log("连接失败：" + error.message);
        port = undefined;
        setConnected(false);
      }
    });

    el("disconnect").addEventListener("click", disconnect);
    el("power").addEventListener("input", event => {
      el("powerValue").textContent = event.target.value;
      if (activeCommand.startsWith("PWM")) startTest();
    });
    el("start").addEventListener("click", startTest);
    el("full").addEventListener("click", () => {
      el("power").value = "100";
      el("powerValue").textContent = "100";
      startTest();
    });
    el("stop").addEventListener("click", stopTest);
    el("reset").addEventListener("click", resetMeasurement);
    el("edgesPerRev").addEventListener("change", () => {
      maxRpmL = 0;
      maxRpmR = 0;
      leftHistory.length = 0;
      rightHistory.length = 0;
      el("maxRpmL").textContent = "0";
      el("maxRpmR").textContent = "0";
    });
    setConnected(false);
    setInterval(() => { if (activeCommand) send(activeCommand, false); }, 300);
    navigator.serial?.addEventListener("disconnect", disconnect);
    window.addEventListener("beforeunload", () => {
      if (port?.writable) send("STOP", false);
    });
  </script>
</body>
</html>
